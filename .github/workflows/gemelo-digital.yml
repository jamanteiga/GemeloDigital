name: 🚗 Generar Gemelo Digital Automático

on:
  push:
    paths:
      - 'data/*.xlsx'
  schedule:
    - cron: '0 * * * *'  # Cada hora
  workflow_dispatch:  # Ejecutar manualmente desde GitHub

jobs:
  gemelo-digital:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Descargar código
      uses: actions/checkout@v3
    
    - name: 🐍 Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: 📦 Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: 🔍 Buscar archivo Excel más reciente
      id: find_excel
      run: |
        LATEST_XLSX=$(find data -name "*.xlsx" -type f -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -1 | cut -d' ' -f2-)
        if [ -z "$LATEST_XLSX" ]; then
          echo "⚠️ No hay archivos Excel en data/"
          echo "ARCHIVO_XLSX=" >> $GITHUB_OUTPUT
          exit 0
        fi
        echo "ARCHIVO_XLSX=$LATEST_XLSX" >> $GITHUB_OUTPUT
        echo "✅ Archivo encontrado: $LATEST_XLSX"
    
    - name: 🚗 Generar Gemelo Digital
      if: steps.find_excel.outputs.ARCHIVO_XLSX != ''
      run: |
        echo "Procesando: ${{ steps.find_excel.outputs.ARCHIVO_XLSX }}"
        python gemelo_digital.py "${{ steps.find_excel.outputs.ARCHIVO_XLSX }}"
    
    - name: 📁 Crear carpeta docs si no existe
      run: |
        mkdir -p docs
    
    - name: 📊 Mover gráficos a docs/
      if: steps.find_excel.outputs.ARCHIVO_XLSX != ''
      run: |
        # Mover todos los gráficos generados
        mv gemelo_digital_*.html docs/ 2>/dev/null || true
        
        # Crear o actualizar index.html
        if [ -f "gemelo_digital_indice.html" ]; then
          cp gemelo_digital_indice.html docs/index.html
          echo "✅ index.html actualizado"
        else
          echo "⚠️ No se generó gemelo_digital_indice.html"
        fi
    
    - name: ⚙️ Configurar Git
      run: |
        git config --local user.email "github-actions@github.com"
        git config --local user.name "GitHub Actions Bot"
    
    - name: 💾 Commit cambios
      run: |
        if git diff-index --quiet HEAD; then
          echo "✅ Sin cambios para commit"
        else
          git add -A
          git commit -m "🚗 Gemelo Digital actualizado $(date '+%Y-%m-%d %H:%M:%S')"
          echo "✅ Cambios commitados"
        fi
    
    - name: 🚀 Push cambios a GitHub
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ github.ref }}
    
    - name: ✅ Crear resumen
      if: always()
      run: |
        echo "## 🚗 Gemelo Digital - Ejecución Completada" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Archivo procesado:** ${{ steps.find_excel.outputs.ARCHIVO_XLSX }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**GitHub Pages:** https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Gráficos generados:**" >> $GITHUB_STEP_SUMMARY
        echo "- 📊 Tablero Principal" >> $GITHUB_STEP_SUMMARY
        echo "- 🏎️ Motor 3D" >> $GITHUB_STEP_SUMMARY
        echo "- 🔥 Mapa de Calor" >> $GITHUB_STEP_SUMMARY
        echo "- 📳 Vibraciones 3D" >> $GITHUB_STEP_SUMMARY
        echo "- 🏁 Dinámica Conducción" >> $GITHUB_STEP_SUMMARY
        echo "- 🔗 Correlaciones" >> $GITHUB_STEP_SUMMARY
        echo "- 🔍 Diagnóstico" >> $GITHUB_STEP_SUMMARY
        echo "- 🚗 Vehículo 3D" >> $GITHUB_STEP_SUMMARY
